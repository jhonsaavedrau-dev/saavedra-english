<style>
/* Una sola columna con tres pasos (anota, corrige, presenta). Barra de captura abajo. Sistema saavedra english v2, versión sobria. */
:root{
  --fondo:#F6F7FB;--carta:#FFFFFF;--tinta:#1A1C3A;--suave:#62668A;--linea:#E6E8F2;
  --azul:#2F5BFF;--azul-o:#1D3FD1;--azul-t:#EAF0FF;--rojo:#FF4F45;--rojo-o:#D9342B;--rojo-t:#FFECEB;
  --sol:#FFD23F;--sol-t:#FFF6D6;--menta:#16C47F;--menta-o:#0E9C63;--menta-t:#E3F8EF;--lila:#8C7CFF;--lila-o:#6A58E8;--lila-t:#EFEDFF;
  --sobre:#FFFFFF;--sobre-sol:#1A1C3A;--velo:rgba(18,20,43,.55);
  --f-tit:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-tx:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#12142B;--carta:#1C1F3D;--tinta:#F1F2FA;--suave:#A3A7C7;--linea:#2C305A;
  --azul:#6A8CFF;--azul-o:#3B5FE6;--azul-t:#232B5C;--rojo:#FF7A71;--rojo-o:#D9463E;--rojo-t:#3A2335;
  --sol:#FFD84F;--sol-t:#3A3523;--menta:#36DB97;--menta-o:#14A86B;--menta-t:#173A36;--lila:#A99DFF;--lila-o:#7C6CF0;--lila-t:#2A2752;--velo:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#12142B;--carta:#1C1F3D;--tinta:#F1F2FA;--suave:#A3A7C7;--linea:#2C305A;
  --azul:#6A8CFF;--azul-o:#3B5FE6;--azul-t:#232B5C;--rojo:#FF7A71;--rojo-o:#D9463E;--rojo-t:#3A2335;
  --sol:#FFD84F;--sol-t:#3A3523;--menta:#36DB97;--menta-o:#14A86B;--menta-t:#173A36;--lila:#A99DFF;--lila-o:#7C6CF0;--lila-t:#2A2752;--velo:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 17px/1.5 var(--f-tx);display:flex;flex-direction:column;min-height:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:8px}
.eti{font:500 11px/1.4 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--suave)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-tit);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.del{color:var(--rojo);background:linear-gradient(var(--rojo),var(--rojo)) no-repeat 0 56%/100% .11em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ins{color:var(--azul);font-weight:800;background:var(--azul-t);border-radius:7px;padding:0 .16em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.res{background:var(--sol);color:var(--sobre-sol);border-radius:6px;padding:0 .14em}
.ond{text-decoration:underline wavy var(--lila);text-decoration-thickness:.07em;text-underline-offset:.22em}
.okt{color:var(--menta);font-weight:700}
.cod{display:inline-grid;place-items:center;min-width:32px;height:24px;padding:0 7px;border-radius:999px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;flex:none;color:var(--sobre);background:var(--c,var(--suave))}
.t-GR{--c:var(--rojo)}.t-VO{--c:var(--azul)}.t-PR{--c:var(--sol)}.t-WO{--c:var(--lila)}.t-EX{--c:var(--suave)}.t-OK{--c:var(--menta)}
.cod.t-PR{color:var(--sobre-sol)}
.btn{--c:var(--azul);--o:var(--azul-o);background:var(--c);color:var(--sobre);border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;line-height:1.1;box-shadow:0 3px 0 var(--o);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 0 0 var(--o)}
.btn.sec{--c:var(--carta);--o:var(--linea);color:var(--tinta);border:2px solid var(--linea)}
.btn.lila{--c:var(--lila);--o:var(--lila-o)}
.btn.menta{--c:var(--menta);--o:var(--menta-o)}
.btn.tinta{--c:var(--tinta);--o:var(--suave);color:var(--fondo)}
.btn.peligro{--c:var(--carta);--o:var(--linea);color:var(--rojo);border:2px solid var(--linea)}
.btn.min{background:transparent;border:0;box-shadow:none;padding:6px 4px;color:var(--azul);font-weight:700;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
header.barra{padding-top:12px;padding-bottom:12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--fondo);border-bottom:2px solid var(--linea)}
.marca{display:inline-flex;align-items:center;gap:8px;font:800 17px/1 var(--f-tit);letter-spacing:-.02em;white-space:nowrap}
.marca svg{width:30px;height:30px;flex:none}
.marca .en{background:var(--azul);color:var(--sobre);border-radius:999px;padding:4px 9px 5px;font-size:13px}
.est{display:flex;align-items:center;gap:4px;background:var(--carta);border:2px solid var(--linea);border-radius:999px;padding:3px 6px 3px 12px;min-width:0}
.est select{background:transparent;border:0;padding:4px 2px;font-weight:800;max-width:46vw}
.der{margin-left:auto;display:flex;gap:8px;align-items:center}
main{flex:1;min-height:0;overflow:auto}
.vista{max-width:860px;margin:0 auto;padding-top:22px;padding-bottom:40px;display:grid;gap:18px}
.empieza{background:var(--carta);border:2px solid var(--linea);border-radius:22px;padding:24px;display:grid;gap:16px}
.empieza h1{font-size:clamp(30px,5vw,44px)}
.empieza p{color:var(--suave)}
.empieza label{display:grid;gap:6px}
.empieza select{background:var(--fondo);border:2px solid var(--linea);border-radius:12px;padding:11px 12px;font-size:17px;font-weight:700;width:100%}
.recientes{display:grid;gap:8px}
.recientes button{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--carta);border:2px solid var(--linea);border-radius:14px;padding:12px 14px}
.recientes button:hover{border-color:var(--azul)}
.fe{font:500 12px/1.3 var(--f-mono);color:var(--suave);font-variant-numeric:tabular-nums}
.s-cab{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:flex-end;justify-content:space-between}
.s-cab h1{font-size:clamp(26px,4.4vw,38px)}
.uni-chip{display:inline-flex;align-items:center;gap:8px;background:var(--azul-t);color:var(--azul);border-radius:999px;padding:5px 12px 5px 5px;font-weight:800;font-size:14px}
.uni-chip b{background:var(--azul);color:var(--sobre);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font:800 14px/1 var(--f-tit)}
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.paso{background:var(--carta);border:2px solid var(--linea);border-radius:16px;padding:12px 14px;display:grid;gap:2px}
.paso .n{font:800 22px/1 var(--f-tit);color:var(--suave)}
.paso b{font-size:15px}
.paso span.d{font-size:13px;color:var(--suave)}
.paso.on{border-color:var(--azul);background:var(--azul-t)}
.paso.on .n{color:var(--azul)}
.paso.hecho .n{color:var(--menta)}
@media (max-width:560px){.paso span.d{display:none}.paso{padding:10px}}
.guia{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--carta);border:2px dashed var(--linea);border-radius:16px;padding:14px 16px}
.guia p{flex:1 1 260px;color:var(--suave);font-size:15px}
.guia p b{color:var(--tinta)}
ol.lineas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ln{background:var(--carta);border:2px solid var(--linea);border-radius:16px;transition:border-color .2s}
.ln:hover{border-color:color-mix(in srgb,var(--azul) 35%,var(--linea))}
.ln-v{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;width:100%;text-align:left;background:transparent;border:0;border-radius:14px}
.ln .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--fondo);font:500 12px/1 var(--f-mono);color:var(--suave)}
.ln .tx{font:600 clamp(18px,2vw,21px)/1.45 var(--f-tx);min-width:0;overflow-wrap:anywhere}
.ln .nota{display:block;font:400 15px/1.4 var(--f-tx);color:var(--suave);margin-top:3px}
.ln .pend{font-weight:800;font-size:13px;color:var(--suave);background:var(--fondo);border-radius:999px;padding:6px 10px;white-space:nowrap}
.ln.abierta{border-color:var(--azul)}
.ln.ia{border-style:dashed;border-color:var(--lila)}
.editor{display:grid;gap:12px;padding:0 14px 14px 56px}
@media (max-width:600px){.editor{padding-left:14px}}
.editor label{display:grid;gap:4px}
.editor input{background:var(--fondo);border:2px solid var(--linea);border-radius:12px;padding:10px 12px;font-size:19px;font-weight:600;width:100%}
.editor input:focus{border-color:var(--azul);outline:none}
.editor .nota-in{font-size:16px;font-weight:400}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tagb{background:var(--carta);border:2px solid var(--linea);border-radius:999px;padding:3px 12px 3px 3px;display:inline-flex;gap:7px;align-items:center;font-size:14px;font-weight:700}
.tagb[aria-pressed="true"]{border-color:var(--tinta)}
.ed-acc{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.cierre,.panelh{background:var(--carta);border:2px solid var(--linea);border-radius:20px;padding:18px;display:grid;gap:12px;min-width:0}
.cierre h3,.panelh h3{font-size:20px}
.cierre .fila{display:flex;gap:8px;flex-wrap:wrap}
details{background:var(--carta);border:2px solid var(--linea);border-radius:18px;padding:4px 16px}
details[open]{padding-bottom:16px}
summary{cursor:pointer;font-weight:800;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--suave);font-weight:400}
details[open] summary::after{content:"−"}
.voc{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.voc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;background:var(--fondo);border-radius:12px;padding:8px 10px}
.voc .f{font:500 12px/1.4 var(--f-mono);color:var(--suave)}
.voc em{grid-column:1/-1;font-size:14px;color:var(--suave)}
.voc .x{background:transparent;border:0;color:var(--suave);font-size:18px;grid-row:1;grid-column:2}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
@media (max-width:640px){.mini{grid-template-columns:minmax(0,1fr)}}
.mini input,details textarea{background:var(--fondo);border:2px solid transparent;border-radius:10px;padding:8px 10px;font-size:15px;width:100%}
details textarea{resize:vertical;min-height:72px;margin-top:4px}
.mini input:focus,details textarea:focus{outline:none;border-color:var(--azul)}
.rec{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rec li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;font-weight:600}
.rec .veces{font:500 12px/1 var(--f-mono);color:var(--sobre);background:var(--rojo);border-radius:999px;padding:5px 8px;white-space:nowrap}
.aviso{font-size:14px;color:var(--suave)}
.captura{background:var(--fondo);border-top:2px solid var(--linea);padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.captura .in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--carta);border:2px solid var(--linea);border-radius:16px;padding:6px 6px 6px 14px}
.captura .in:focus-within{border-color:var(--azul)}
.captura input{flex:1;min-width:0;background:transparent;border:0;padding:8px 2px;font-size:19px;font-weight:600}
.captura input:focus{outline:none}
.ficha-est{background:var(--azul);color:var(--sobre);border-radius:22px;padding:22px;display:grid;gap:12px;position:relative;overflow:hidden}
.ficha-est::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--sol);right:-40px;top:-50px}
.ficha-est .eti{color:var(--sobre);opacity:.8}
.ficha-est h1{font-size:clamp(34px,5vw,56px);position:relative;z-index:1}
.ficha-est .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:end;position:relative;z-index:1}
.ficha-est label{display:grid;gap:4px}
.ficha-est input,.ficha-est select{background:rgba(255,255,255,.18);border:0;border-radius:10px;padding:8px 10px;font-size:16px;color:var(--sobre);font-weight:700;max-width:100%}
.ficha-est select option{color:#1A1C3A;background:#FFFFFF}
.barras{display:grid;gap:10px}
.barras .b{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:15px;font-weight:600}
.barras .pista{height:12px;background:var(--fondo);border-radius:999px;overflow:hidden}
.barras .pista i{display:block;height:100%;border-radius:999px}
.barras .v{font:500 13px/1 var(--f-mono);text-align:right}
#pres{position:fixed;inset:0;background:var(--fondo);z-index:20;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.p-cab,.p-pie{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.p-modos{display:flex;gap:4px;flex-wrap:wrap;background:var(--carta);border:2px solid var(--linea);border-radius:999px;padding:3px}
.p-modos button{background:transparent;border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--suave)}
.p-modos button[aria-pressed="true"]{background:var(--tinta);color:var(--fondo)}
.p-ct{background:var(--carta);border:2px solid var(--linea);border-radius:24px;padding:5vh max(20px,5vw);display:flex;flex-direction:column;justify-content:center;gap:3vh;min-width:0;min-height:0;position:relative;overflow:auto}
.p-frase{font:700 clamp(28px,4.4vw,68px)/1.3 var(--f-tx);overflow-wrap:anywhere;text-wrap:balance}
.p-nota{font-size:clamp(18px,2vw,30px);color:var(--suave)}
.p-pista{display:flex;gap:12px;align-items:center;font-size:clamp(16px,1.6vw,22px);color:var(--suave);font-weight:700}
.p-num{font:800 clamp(22px,2.6vw,36px)/1 var(--f-tit);color:var(--azul)}
.p-lista{list-style:none;margin:0;padding:0;display:grid;gap:1.4vh}
.p-lista li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:14px;align-items:center;font:700 clamp(18px,2.3vw,36px)/1.35 var(--f-tx);background:var(--fondo);border-radius:14px;padding:1.2vh 16px}
.p-lista .n{font:500 .45em/1 var(--f-mono);color:var(--suave)}
.p-ct.tema{background:var(--lila);color:var(--sobre);border-color:var(--lila)}
.p-ct.tema .eti{color:var(--sobre);opacity:.85}
.p-tema{font:800 clamp(28px,4.4vw,64px)/1.2 var(--f-tit);letter-spacing:-.02em;text-wrap:balance}
.p-reloj{display:flex;align-items:center;gap:18px}
.p-reloj svg{width:clamp(70px,9vw,140px);height:auto;flex:none}
.p-reloj circle{fill:none;stroke-width:9}
.p-reloj .base{stroke:rgba(255,255,255,.28)}
.p-reloj .prog{stroke:var(--sobre);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:283;transition:stroke-dashoffset 1s linear}
.p-reloj .num{font:500 clamp(40px,6vw,96px)/1 var(--f-mono);font-variant-numeric:tabular-nums}
.p-ct h2{font-size:clamp(28px,4vw,58px)}
.g-idea{font-size:clamp(18px,1.9vw,28px);line-height:1.5}
.g-forma{display:grid;gap:1vh}
.g-forma div{display:grid;grid-template-columns:minmax(120px,26%) minmax(0,1fr);gap:16px;align-items:baseline;background:var(--fondo);border-radius:14px;padding:1.2vh 16px}
.g-forma .k{font:500 clamp(11px,1vw,15px)/1.4 var(--f-mono);color:var(--suave);text-transform:uppercase}
.g-forma .v{font:700 clamp(18px,2.2vw,32px)/1.3 var(--f-tx)}
.g-ojo{background:var(--rojo-t);border-radius:14px;padding:1.4vh 16px;font-size:clamp(16px,1.7vw,24px)}
.g-ojo b{color:var(--rojo-o)}
@media (max-width:600px){.g-forma div{grid-template-columns:minmax(0,1fr);gap:2px}}
@media (prefers-reduced-motion:no-preference){
  .ln.nueva{animation:entrar .4s cubic-bezier(.3,1.5,.5,1)}
  @keyframes entrar{from{transform:translateY(14px) scale(.97);opacity:0}}
  .revela .del{animation:tachar .45s ease both}
  .revela .ins{display:inline-block;animation:pop .5s cubic-bezier(.3,1.7,.5,1) .3s both}
  @keyframes tachar{from{background-size:0 .11em;color:var(--tinta)}}
  @keyframes pop{from{transform:scale(.3);opacity:0}}
  .entra{animation:entrar .4s cubic-bezier(.3,1.5,.5,1)}
  .cargando{animation:latir 1s ease-in-out infinite}
  @keyframes latir{50%{opacity:.55}}
}
.confeti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confeti i{position:absolute;width:10px;height:16px;border-radius:3px;top:45%;left:50%;animation:volar 1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes volar{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.capa{position:fixed;inset:0;background:var(--velo);z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--carta);border-radius:24px;width:min(640px,100%);max-height:100%;overflow:auto;padding:24px;display:grid;gap:16px}
.panel h2{font-size:28px}
.panel label{display:grid;gap:4px}
.panel input,.panel select{background:var(--fondo);border:2px solid var(--linea);border-radius:12px;padding:10px 12px;font-size:18px;max-width:100%}
.panel pre{margin:0;white-space:pre-wrap;background:var(--fondo);border-radius:14px;padding:16px;font:500 14px/1.6 var(--f-mono);overflow-wrap:anywhere;max-height:50vh;overflow:auto}
.panel .fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--fondo);padding:11px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- pizarra blanca ---------- */

<script>
(function(){
"use strict";
const U=window.UNIDADES||[];
const uni=n=>U.find(u=>u.n===+n)||null;
const TAGS=[["GR","Gramática"],["VO","Vocabulario"],["PR","Pronunciación"],["WO","Orden"],["EX","Más natural"],["OK","Bien dicho"]];
const TAGN=Object.fromEntries(TAGS);
const S={est:{},ses:{},cur:{est:null,ses:null},vista:"clase",abierta:null,pres:{modo:"una",i:0,ver:false,g:0,q:0},ia:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fFecha=iso=>{try{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}catch(e){return iso}};
const fCorta=iso=>{try{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return iso}};
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2400)}

let db=null,sample=null,descargas=null;const LS="saavedra-tablero-v2";
const pend={},cola={},ultima={};
function lsGuardar(){try{localStorage.setItem(LS,JSON.stringify({est:S.est,ses:S.ses}))}catch(e){}}
function escribir(col,id,data){
  ultima[col+"/"+id]=Date.now();
  if(!db){lsGuardar();return}
  const k=col+"/"+id;pend[k]=data;clearTimeout(escribir["t"+k]);
  escribir["t"+k]=setTimeout(()=>{const d=pend[k];delete pend[k];if(!d)return;
    cola[k]=(cola[k]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(JSON.parse(JSON.stringify(d)))).catch(e=>{
      if(e&&e.code==="quota_exceeded")toast("No queda espacio: borra clases viejas.");
      else if(e&&e.code==="unavailable")setTimeout(()=>escribir(col,id,(col==="estudiantes"?S.est:S.ses)[id]),1500);
      else toast("No se pudo guardar. Revisa la conexión.")});
  },500);
}
function borrar(col,id){if(!db){lsGuardar();return}delete pend[col+"/"+id];cola[col+"/"+id]=(cola[col+"/"+id]||Promise.resolve()).then(()=>db.collection(col).doc(id).delete()).catch(()=>toast("No se pudo borrar."))}
function recibir(col,snap){
  const mapa=col==="estudiantes"?S.est:S.ses,vistos=new Set();
  snap.docs.forEach(d=>{vistos.add(d.id);const k=col+"/"+d.id;if(pend[k]||Date.now()-(ultima[k]||0)<2500)return;mapa[d.id]=JSON.parse(JSON.stringify(d.data()))});
  Object.keys(mapa).forEach(id=>{const k=col+"/"+id;if(!vistos.has(id)&&!pend[k]&&Date.now()-(ultima[k]||0)>2500)delete mapa[id]});
  const a=document.activeElement;
  if(S.abierta||(a&&a.closest&&a.closest(".vista")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){cabEst();return}
  elegir();render();
}

const estudiantes=()=>Object.values(S.est).sort((a,b)=>a.nombre.localeCompare(b.nombre));
const sesionesDe=eid=>Object.values(S.ses).filter(s=>s.est===eid).sort((a,b)=>(b.fecha+(b.creada||"")).localeCompare(a.fecha+(a.creada||"")));
const sesion=()=>S.ses[S.cur.ses]||null;
function elegir(){
  if(!S.cur.est||!S.est[S.cur.est]){const l=estudiantes();S.cur.est=l.length?l[0].id:null}
  if(S.cur.ses&&(!S.ses[S.cur.ses]||S.ses[S.cur.ses].est!==S.cur.est))S.cur.ses=null;
  if(!S.cur.ses&&S.cur.est&&!S.nueva0){const l=sesionesDe(S.cur.est);if(l.length&&l[0].fecha===hoyISO())S.cur.ses=l[0].id}
}
function guardarSes(){const s=sesion();if(s)escribir("sesiones",s.id,s)}

const limpia=w=>w.toLowerCase().replace(/[.,!?;:"“”]/g,"");
function diff(a,b){
  const A=a.trim().split(/\s+/).filter(Boolean),B=b.trim().split(/\s+/).filter(Boolean),n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;const push=(t,w)=>{const l=out[out.length-1];if(l&&l.t===t)l.w.push(w);else out.push({t,w:[w]})};
  while(i<n&&j<m){if(A[i]===B[j]){push("eq",A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){push("del",A[i]);i++}else{push("ins",B[j]);j++}}
  while(i<n)push("del",A[i++]);while(j<m)push("ins",B[j++]);return out;
}
const prPal=l=>(l.nota||"").trim().split(/[\s/]+/)[0]||"";
function htmlLinea(l,ver=true){
  if(!ver||!l.fix||l.fix.trim()===l.said.trim()){
    let h=esc(l.said);
    if(ver&&l.tag==="PR"){const p=prPal(l);if(p){const re=new RegExp("\\b("+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","i");h=h.replace(re,'<span class="res">$1</span>')}}
    if(ver&&l.tag==="OK")h='<span class="okt">'+h+'</span>';
    return h;
  }
  if(l.tag==="WO")return '<span class="ond">'+esc(l.said)+'</span> <span class="ins">'+esc(l.fix)+'</span>';
  return diff(l.said,l.fix).map(o=>o.t==="eq"?esc(o.w.join(" ")):o.t==="del"?'<span class="del">'+esc(o.w.join(" "))+'</span>':'<span class="ins">'+esc(o.w.join(" "))+'</span>').join(" ");
}
function claveErr(l){
  if(!l.tag||l.tag==="OK")return null;
  if(l.tag==="PR"){const p=limpia(prPal(l));return p?"PR|"+p:null}
  if(!l.fix||l.fix.trim()===l.said.trim())return null;
  const o=diff(l.said,l.fix);return l.tag+"|"+limpia(o.filter(x=>x.t==="del").map(x=>x.w.join(" ")).join(" … "))+"→"+limpia(o.filter(x=>x.t==="ins").map(x=>x.w.join(" ")).join(" … "));
}
function recurrentes(eid){
  const m={};sesionesDe(eid).forEach(s=>(s.lineas||[]).forEach(l=>{const k=claveErr(l);if(!k)return;(m[k]=m[k]||{k,tag:l.tag,ej:l,ses:new Set()}).ses.add(s.id)}));
  return Object.values(m).filter(x=>x.ses.size>=2).sort((a,b)=>b.ses.size-a.ses.size);
}
function etRec(x){
  if(x.tag==="PR")return '<span class="res">'+esc(prPal(x.ej))+'</span>';
  const [d,i]=x.k.split("|")[1].split("→");return (d?'<span class="del">'+esc(d)+'</span> ':'')+(i?'<span class="ins">'+esc(i)+'</span>':'');
}

/* Ortografía en inglés: corrige solo el tecleo de lo anotado (no la gramática del estudiante). Una llamada rápida. */
async function ortografia(){
  const s=sesion();if(!s)return;
  if(S.ortoPrev){S.ortoPrev.forEach(([l,a,b])=>{l.said=a;l.fix=b});S.ortoPrev=null;clearTimeout(S.ortoT);guardarSes();renderClase();toast("Volví al texto original.");return}
  if(!sample||S.orto)return;
  const ls=s.lineas||[];if(!ls.length)return;
  const textos=[];ls.forEach(l=>{textos.push(l.said);textos.push(l.fix||"")});
  const prompt="Fix ONLY English spelling mistakes (typos, swapped or missing letters, lowercase \"i\" as a pronoun) in each text. "+
   "Do NOT change grammar, verb forms, word choice, word order or punctuation: these are a student's spoken sentences and the grammar errors must stay for the teacher to correct. "+
   "Leave Spanish words unchanged. Empty texts stay empty.\n"+
   'Reply ONLY with JSON: {"t":["..."]} with exactly '+textos.length+' items in the same order.\nTexts: '+JSON.stringify(textos);
  S.orto=true;renderClase();
  try{
    const r=await sample.json(prompt,{modelTier:"quick"});
    const t=(r&&Array.isArray(r.t))?r.t:[];if(t.length!==textos.length)throw {code:"forma"};
    const prev=[],cambios=[];
    ls.forEach((l,i)=>{const a=String(t[2*i]??l.said),b=String(t[2*i+1]??(l.fix||""));
      if((a!==l.said&&a.trim())||(b!==(l.fix||"")&&l.fix)){prev.push([l,l.said,l.fix]);
        const A=l.said.split(/\s+/),B=a.split(/\s+/);if(A.length===B.length)A.forEach((w,k)=>{if(w!==B[k])cambios.push(w+" → "+B[k])});
        if(a.trim())l.said=a;if(l.fix&&b.trim())l.fix=b}});
    if(!prev.length)toast("Sin errores de ortografía.");
    else{S.ortoPrev=prev;guardarSes();toast("Corregí: "+(cambios.slice(0,4).join(", ")||prev.length+" frases")+(cambios.length>4?"…":""));clearTimeout(S.ortoT);S.ortoT=setTimeout(()=>{S.ortoPrev=null;if(sesion())renderClase()},12000)}
  }catch(e){
    if(e&&e.code==="rate_limited")toast("Muchas solicitudes seguidas. Espera un momento.");
    else if(e&&(e.code==="not_granted"||e.code==="unavailable"))toast("La corrección de ortografía no está disponible aquí.");
    else toast("No se pudo revisar la ortografía. Inténtalo otra vez.");
  }
  S.orto=false;renderClase();
}
/* Corregir con IA: una sola llamada, modelo rápido, solo las frases pendientes. */
async function corregirIA(){
  const s=sesion();if(!s||!sample||S.ia)return;
  const lista=(s.lineas||[]).map((l,i)=>({i,s:l.said,l})).filter(x=>!x.l.tag);
  if(!lista.length)return;
  const u=uni(s.unidad);
  const prompt="You correct sentences spoken by a Spanish-speaking English student (level A2-B1, book Interchange 3"+(u?", unit "+u.n+": "+u.gram.map(g=>g.t).join("; "):"")+").\n"+
   "For each sentence give the corrected version with the fewest changes (keep the student's words and meaning). Tags: GR grammar, VO wrong word, WO word order, EX correct but unnatural (give the natural version), OK already correct (fix = same sentence).\n"+
   "nota: Spanish, max 10 words, the rule (empty for OK).\n"+
   'Reply ONLY with JSON: [{"i":0,"fix":"...","tag":"GR","nota":"..."}]\n'+
   "Sentences: "+JSON.stringify(lista.map(x=>({i:x.i,s:x.s})));
  S.ia=true;renderClase();
  try{
    const r=await sample.json(prompt,{modelTier:"quick"});
    const arr=Array.isArray(r)?r:(r&&r.items)||[];let n=0;
    arr.forEach(x=>{const l=s.lineas[x.i];if(!l||l.tag)return;const tag=["GR","VO","WO","EX","OK"].includes(x.tag)?x.tag:"GR";l.fix=String(x.fix||l.said);l.tag=tag;l.nota=tag==="OK"?"":String(x.nota||"").slice(0,90);l.ia=true;n++});
    guardarSes();toast(n?"Listo: revisa las "+n+" propuestas antes de presentar.":"No llegaron correcciones. Corrígelas a mano.");
  }catch(e){
    if(e&&(e.code==="not_granted"||e.code==="unavailable")){sample=null;toast("La corrección con IA no está disponible aquí.")}
    else if(e&&e.code==="rate_limited")toast("Muchas solicitudes seguidas. Espera un momento.");
    else toast("No se pudo corregir. Inténtalo otra vez o corrige a mano.");
  }
  S.ia=false;renderClase();
}

  ses.forEach(s=>(s.lineas||[]).forEach(l=>{if(l.tag)tot[l.tag]=(tot[l.tag]||0)+1}));const max=Math.max(1,...Object.values(tot));

  h+='<div class="panelh"><h3>Errores que se repiten</h3>'+(rec.length?'<ul class="rec">'+rec.map(x=>'<li><span class="cod t-'+x.tag+'">'+x.tag+'</span><span>'+etRec(x)+'</span><span class="veces">'+x.ses.size+' clases</span></li>').join("")+'</ul>':'<p class="aviso">Aparecen cuando el mismo error sale en dos clases distintas.</p>')+'</div>';
  v.innerHTML=h;
  v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.cur.ses=b.dataset.s;S.vista="clase";render()});
  $("hNombre").oninput=ev=>{const n=ev.target.value.trim();if(!n)return;e.nombre=n;escribir("estudiantes",e.id,e);cabEst()};
  $("hUni").onchange=ev=>{e.unidad=+ev.target.value;escribir("estudiantes",e.id,e)};
}

function mover(d){const ls=(sesion()||{}).lineas||[];const n=Math.max(0,Math.min(ls.length-1,S.pres.i+d));if(n!==S.pres.i){S.pres.i=n;S.pres.ver=false;renderPres()}}
document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{S.pres.modo=b.dataset.pm;S.pres.ver=false;renderPres()});

function resumen(){
  const s=sesion(),e=S.est[S.cur.est];if(!s||!e)return "";const u=uni(s.unidad);

<script>
/* Pizarra blanca: trazos vectoriales en un lienzo lógico de 1600×1000 (se ve igual al compartir pantalla).
   Cada página se guarda como un documento en la colección «pizarras» (o en este navegador si no hay db). */
(function(){
"use strict";
const T=window.__tab||{};const $=id=>document.getElementById(id);
const W=1600,H=1000,R=2;
const TAM={m:[4,7,13],h:[22,34,50],e:[30,64,120],x:[44,62,90]};
const NEGRO="#1E2026",AZUL="#1F4FD8",ROJO="#D7263D";
let paginas=[{n:0,f:"",s:[]}],pi=0,deshechos=[],cur=null,herr={t:"m",c:NEGRO},ultimoColor=NEGRO,grosor=1,clave=null,sucio=new Set(),tGuardar=null;
const cola={};
const base=$("pzC"),capa=$("pzL"),bctx=base.getContext("2d"),lctx=capa.getContext("2d");
const cache=document.createElement("canvas");cache.width=W*R;cache.height=H*R;const cctx=cache.getContext("2d");cctx.setTransform(R,0,0,R,0,0);
const pag=()=>paginas[pi];
const fuente=s=>"700 "+s+"px Caveat, 'Comic Sans MS', cursive";

function trazo(ctx,s){
  if(s.t==="c"){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.restore();return}
  if(s.t==="x"){ctx.save();ctx.fillStyle=s.c;ctx.font=fuente(s.s);ctx.textBaseline="top";String(s.txt).split("\n").forEach((l,i)=>ctx.fillText(l,s.x,s.y+i*s.s*1.05));ctx.restore();return}

  ctx.save();ctx.lineCap=s.t==="h"?"butt":"round";ctx.lineJoin="round";ctx.lineWidth=s.w;ctx.strokeStyle=s.t==="e"?"#000":s.c;
  if(s.t==="e")ctx.globalCompositeOperation="destination-out";
  if(s.t==="h")ctx.globalAlpha=.4;
  ctx.beginPath();ctx.moveTo(p[0],p[1]);
  if(p.length===2)ctx.lineTo(p[0]+.5,p[1]+.5);
  for(let i=2;i<p.length-2;i+=2){ctx.quadraticCurveTo(p[i],p[i+1],(p[i]+p[i+2])/2,(p[i+1]+p[i+3])/2)}

}
function rehacerCache(){cctx.save();cctx.setTransform(1,0,0,1,0,0);cctx.clearRect(0,0,cache.width,cache.height);cctx.restore();pag().s.forEach(s=>trazo(cctx,s))}

  $("pzPag").textContent=(pi+1)+"/"+paginas.length;$("pzAnt").disabled=pi===0;$("pzSig").disabled=pi===paginas.length-1;
  $("pzDes").disabled=!pag().s.length;$("pzReh").disabled=!deshechos.length;
  $("pzFondo").value=pag().f||"";const sup=$("pzSup");sup.classList.toggle("lineas",pag().f==="lineas");sup.classList.toggle("cuadros",pag().f==="cuadros");
  document.querySelectorAll("#pzBandeja [data-t]").forEach(b=>{const on=b.dataset.t===herr.t&&(!b.dataset.c||b.dataset.c===herr.c||herr.t!=="m");b.classList.toggle("on",on&&b.classList.contains("mk")||on&&b.classList.contains("borrador"));if(b.id==="pzTexto")b.setAttribute("aria-pressed",herr.t==="x")});
  document.querySelectorAll(".grosores [data-g]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.g===grosor));
  capa.classList.toggle("texto",herr.t==="x");capa.classList.toggle("borra",herr.t==="e");
}
let esc=1;
function ajustar(){
  const z=$("pzZona").getBoundingClientRect();const bw=Math.max(200,Math.min(z.width-24,(z.height-24)*1.6)),bh=bw/1.6;
  const sup=$("pzSup");sup.style.width=bw+"px";sup.style.height=bh+"px";esc=bw/W;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  [[base,bctx],[capa,lctx]].forEach(([c,x])=>{c.width=Math.round(bw*dpr);c.height=Math.round(bh*dpr);c.style.width=bw+"px";c.style.height=bh+"px";x.setTransform(c.width/W,0,0,c.height/H,0,0)});
  sup.style.setProperty("--paso",(62*esc)+"px");pintar();
}
function pt(e){const r=capa.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*W),Math.round((e.clientY-r.top)/r.height*H)]}

/* ---------- dibujar ---------- */
capa.addEventListener("pointerdown",e=>{
  if(e.button>0)return;cerrarMenu();
  if(herr.t==="x"){e.preventDefault();abrirTexto(pt(e));return}
  try{capa.setPointerCapture(e.pointerId)}catch(_){}const [x,y]=pt(e);
  let w=TAM[herr.t][grosor];if(e.pointerType==="pen"&&herr.t==="m"&&e.pressure)w=Math.max(2,Math.round(w*(.6+e.pressure*.8)));
  cur={t:herr.t,c:herr.c,w,p:[x,y]};pintar();e.preventDefault();
});
capa.addEventListener("pointermove",e=>{
  if(herr.t==="e"){const g=$("pzGoma"),r=capa.getBoundingClientRect(),s=TAM.e[grosor]*esc;g.hidden=false;g.style.width=g.style.height=s+"px";g.style.left=(e.clientX-r.left)+"px";g.style.top=(e.clientY-r.top)+"px"}
  if(!cur)return;

  pintar();

capa.addEventListener("pointerleave",()=>{$("pzGoma").hidden=true});
function soltar(){if(!cur)return;const s=cur;cur=null;agregar(s);pintar()}
capa.addEventListener("pointerup",soltar);capa.addEventListener("pointercancel",soltar);
function agregar(s){pag().s.push(s);deshechos=[];trazo(cctx,s);marcar();interfaz()}

/* ---------- texto con teclado ---------- */
const ta=$("pzT");let taPos=null;
function abrirTexto([x,y]){
  if(!ta.hidden)cerrarTexto(true);
  taPos={x,y,s:TAM.x[grosor],c:ultimoColor};
  ta.value="";ta.hidden=false;ta.style.left=(x*esc)+"px";ta.style.top=(y*esc)+"px";ta.style.fontSize=(taPos.s*esc)+"px";ta.style.color=taPos.c;ta.style.width=(Math.max(160,W-x-20)*esc)+"px";ta.style.height=(taPos.s*1.15*esc)+"px";
  setTimeout(()=>ta.focus(),0);
}
ta.addEventListener("input",()=>{const n=ta.value.split("\n").length;ta.style.height=(taPos.s*1.08*n*esc+6)+"px"});
function cerrarTexto(guardar){if(ta.hidden)return;const v=ta.value.replace(/\s+$/,"");ta.hidden=true;if(guardar&&v&&taPos)agregar({t:"x",c:taPos.c,s:taPos.s,x:taPos.x,y:taPos.y,txt:v});taPos=null;pintar()}

ta.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();cerrarTexto(false)}if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();ta.blur()}e.stopPropagation()});

/* ---------- traer contenido de la clase ---------- */
function partir(txt,max){const out=[];let l="";String(txt).split(/\s+/).forEach(w=>{if((l+" "+w).trim().length>max){if(l)out.push(l);l=w}else l=(l+" "+w).trim()});if(l)out.push(l);return out}
function siguienteY(){let y=50;pag().s.forEach(s=>{if(s.t==="c")y=50;else if(s.t==="x")y=Math.max(y,s.y+String(s.txt).split("\n").length*s.s*1.05+18)});return y}
function insertar(bloques){
  const s=TAM.x[1];let y=siguienteY();
  const alto=bloques.reduce((a,b)=>a+partir(b.txt,b.max||46).length*s*1.05+(b.gap||8),0);
  if(y+alto>H-30&&pag().s.length){nuevaPagina();y=50}
  bloques.forEach(b=>{const lineas=partir(b.txt,b.max||46);const sz=b.s||s;agregar({t:"x",c:b.c,s:sz,x:b.x||60,y,txt:lineas.join("\n")});y+=lineas.length*sz*1.05+(b.gap||8)});
  pintar();
}
const menu=$("pzMenu");
function cerrarMenu(){menu.hidden=true}
$("pzTraer").onclick=ev=>{
  ev.stopPropagation();if(!menu.hidden){cerrarMenu();return}
  const s=T.sesion&&T.sesion(),u=T.uni&&T.uni((s&&s.unidad)||((T.est&&T.est())||{}).unidad||7);
  let h='<span class="eti">Frases de la clase</span>';
  const ls=(s&&s.lineas)||[];
  h+=ls.length?ls.map((l,i)=>'<button data-fr="'+i+'">'+esc2(l.said)+(l.fix&&l.fix!==l.said?' → <b style="color:#1F4FD8">'+esc2(l.fix)+'</b>':'')+'</button>').join("")+'<button data-todas="1"><b>Traer todas las frases</b></button>':'<div class="vacio">Esta clase aún no tiene frases. Anótalas en el tablero y aparecerán aquí.</div>';
  if(u){h+='<span class="eti">Unidad '+u.n+' · gramática</span>'+u.gram.map((g,i)=>'<button data-gr="'+i+'">'+esc2(g.t)+'</button>').join("");h+='<button data-voc="1">Vocabulario de la unidad '+u.n+'</button>'}
  menu.innerHTML=h;menu.hidden=false;
  const r=$("pzTraer").getBoundingClientRect();menu.style.top=(r.bottom+8)+"px";menu.style.left=Math.max(16,Math.min(innerWidth-menu.offsetWidth-16,r.left))+"px";
  menu.querySelectorAll("[data-fr]").forEach(b=>b.onclick=()=>{traerFrase(ls[+b.dataset.fr]);cerrarMenu()});
  const todas=menu.querySelector("[data-todas]");if(todas)todas.onclick=()=>{ls.forEach(traerFrase);cerrarMenu()};
  menu.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{const g=u.gram[+b.dataset.gr];insertar([{txt:g.t,c:AZUL,s:72,gap:14}].concat(g.forma.map(f=>({txt:f[1],c:NEGRO}))).concat([{txt:"Ojo: "+g.ojo,c:ROJO,s:48,max:60,gap:4}]));cerrarMenu()});
  const vb=menu.querySelector("[data-voc]");if(vb)vb.onclick=()=>{insertar(u.voc.slice(0,8).map(w=>({txt:w[0]+" = "+w[1],c:NEGRO,s:52,max:56,gap:2})));cerrarMenu()};
};
function traerFrase(l){if(!l)return;const b=[{txt:l.said,c:NEGRO,gap:2}];if(l.fix&&l.fix.trim()!==l.said.trim())b.push({txt:"→ "+l.fix,c:AZUL,x:90,gap:16});else b[0].gap=16;insertar(b)}
function esc2(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.addEventListener("click",e=>{if(!menu.hidden&&!menu.contains(e.target)&&e.target.id!=="pzTraer")cerrarMenu()});

/* ---------- herramientas ---------- */
document.querySelectorAll("#pzBandeja [data-t]").forEach(b=>b.onclick=()=>{
  cerrarTexto(true);herr={t:b.dataset.t,c:b.dataset.c||herr.c};if(herr.t==="m")ultimoColor=herr.c;if(herr.t==="x")herr.c=ultimoColor;
  if(herr.t!=="e")$("pzGoma").hidden=true;
  document.querySelectorAll("#pzBandeja .mk,#pzBandeja .borrador").forEach(x=>x.classList.toggle("on",x===b));interfaz();
});
document.querySelectorAll(".grosores [data-g]").forEach(b=>b.onclick=()=>{grosor=+b.dataset.g;interfaz()});
$("pzDes").onclick=()=>{if(!pag().s.length)return;deshechos.push(pag().s.pop());rehacerCache();pintar();marcar();interfaz()};
$("pzReh").onclick=()=>{if(!deshechos.length)return;const s=deshechos.pop();pag().s.push(s);trazo(cctx,s);pintar();marcar();interfaz()};
const bl=$("pzLimpiar");bl.onclick=()=>{if(!pag().s.length)return;if(bl.dataset.ok!=="1"){bl.dataset.ok="1";bl.textContent="¿Borrar la página?";setTimeout(()=>{bl.dataset.ok="";bl.textContent="Borrar todo"},3000);return}bl.dataset.ok="";bl.textContent="Borrar todo";agregar({t:"c"});pintar()};
$("pzFondo").onchange=e=>{pag().f=e.target.value;marcar();interfaz()};
function irA(i){cerrarTexto(true);if(typeof ortoPrevio!=="undefined"&&ortoPrevio){ortoPrevio=null;$("pzOrtoTx").textContent="Ortografía (inglés)"}pi=i;deshechos=[];rehacerCache();pintar();interfaz()}
function nuevaPagina(){paginas.push({n:paginas.length,f:pag().f,s:[]});marcar(paginas.length-1);irA(paginas.length-1)}
$("pzAnt").onclick=()=>pi>0&&irA(pi-1);$("pzSig").onclick=()=>pi<paginas.length-1&&irA(pi+1);$("pzNueva").onclick=nuevaPagina;

/* ---------- guardar ---------- */
function marcar(i){sucio.add(i==null?pi:i);clearTimeout(tGuardar);tGuardar=setTimeout(guardar,900)}
function guardar(){
  const db=T.db&&T.db();const lista=[...sucio];sucio.clear();
  if(!db){try{localStorage.setItem("pizarra-"+clave,JSON.stringify(paginas))}catch(e){}return}
  lista.forEach(i=>{const p=paginas[i];if(!p)return;const id=clave+"-p"+p.n,str=JSON.stringify(p.s);
    if(str.length>240000){T.toast&&T.toast("Esta página está muy llena: sigue en una página nueva.");return}
    cola[id]=(cola[id]||Promise.resolve()).then(()=>db.collection("pizarras").doc(id).set({ses:clave,n:p.n,f:p.f||"",s:str,act:new Date().toISOString()})).catch(()=>{T.toast&&T.toast("No se pudo guardar la pizarra.")});
  });
}
async function cargar(){
  paginas=[{n:0,f:"",s:[]}];pi=0;deshechos=[];
  const db=T.db&&T.db();
  try{
    if(db){const sn=await db.collection("pizarras").where("ses","==",clave).get();const ps=sn.docs.map(d=>d.data()).sort((a,b)=>a.n-b.n).map(d=>({n:d.n,f:d.f||"",s:JSON.parse(d.s||"[]")}));if(ps.length)paginas=ps}
    else{const v=JSON.parse(localStorage.getItem("pizarra-"+clave)||"null");if(Array.isArray(v)&&v.length)paginas=v}
  }catch(e){}
  pi=paginas.length-1;rehacerCache();pintar();interfaz();
}
$("pzPng").onclick=async()=>{
  const d=T.descargas&&T.descargas();if(!d){T.toast&&T.toast("Guardar la imagen no está disponible aquí.");return}
  const c=document.createElement("canvas");c.width=W*R;c.height=H*R;const x=c.getContext("2d");x.fillStyle="#FDFDFB";x.fillRect(0,0,c.width,c.height);
  if(pag().f){x.strokeStyle="rgba(47,91,255,.16)";x.lineWidth=2;for(let yy=62*R;yy<c.height;yy+=62*R){x.beginPath();x.moveTo(0,yy);x.lineTo(c.width,yy);x.stroke()}if(pag().f==="cuadros")for(let xx=62*R;xx<c.width;xx+=62*R){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,c.height);x.stroke()}}
  x.drawImage(cache,0,0);
  c.toBlob(b=>{d.save({filename:"pizarra-"+(clave||"clase")+"-p"+(pi+1)+".png",data:b}).then(()=>T.toast&&T.toast("Imagen guardada"),e=>{if(e&&e.code!=="declined")T.toast&&T.toast("No se pudo guardar la imagen.")})},"image/png");
};


/* ---------- ortografía en inglés: una sola llamada rápida para todo el texto de la página ---------- */
let ortoPrevio=null,ortoT=null;
function textosPagina(){const s=pag().s;let desde=0;s.forEach((x,i)=>{if(x.t==="c")desde=i+1});return s.slice(desde).filter(x=>x.t==="x")}
function cambios(a,b){const A=a.split(/(\s+)/),B=b.split(/(\s+)/),out=[];if(A.length===B.length)A.forEach((w,i)=>{if(w!==B[i]&&w.trim())out.push(w+" → "+B[i])});else if(a!==b)out.push("«"+a.slice(0,30)+"»");return out}
$("pzOrto").onclick=async()=>{
  const bt=$("pzOrto"),tx=$("pzOrtoTx");
  if(ortoPrevio){ortoPrevio.forEach(([st,txt])=>st.txt=txt);ortoPrevio=null;clearTimeout(ortoT);tx.textContent="Ortografía (inglés)";rehacerCache();pintar();marcar();T.toast&&T.toast("Volví al texto original.");return}
  cerrarTexto(true);
  const lista=textosPagina();
  if(!lista.length){T.toast&&T.toast("No hay texto escrito con Aa en esta página. La escritura a mano no se puede revisar.");return}
  const sm=T.sample&&T.sample();
  if(!sm){T.toast&&T.toast("La corrección de ortografía no está disponible aquí.");return}
  bt.disabled=true;tx.textContent="Revisando…";
  const prompt="Fix ONLY the English spelling mistakes in each text (typos, swapped or missing letters, lowercase \"i\" as a pronoun). "+
   "Do NOT change grammar, verb forms, word choice, word order, punctuation or line breaks: a teacher uses these to show a student's grammar errors, so they must stay. "+
   "Leave Spanish words and arrows exactly as they are. If a text has no spelling mistakes, return it unchanged.\n"+
   'Reply ONLY with JSON: {"t":["text 1","text 2"]} with exactly '+lista.length+' items in the same order.\nTexts: '+JSON.stringify(lista.map(x=>x.txt));
  try{
    const r=await sm.json(prompt,{modelTier:"quick"});
    const nuevos=(r&&Array.isArray(r.t))?r.t:Array.isArray(r)?r:[];
    if(nuevos.length!==lista.length)throw {code:"forma"};
    const previo=[],lis=[];
    lista.forEach((st,i)=>{const n=String(nuevos[i]??st.txt);if(n!==st.txt&&n.trim()){previo.push([st,st.txt]);lis.push(...cambios(st.txt,n));st.txt=n}});
    if(!previo.length){T.toast&&T.toast("Sin errores de ortografía en esta página.");tx.textContent="Ortografía (inglés)"}
    else{ortoPrevio=previo;rehacerCache();pintar();marcar();
      T.toast&&T.toast("Corregí "+lis.length+(lis.length===1?" palabra: ":" palabras: ")+lis.slice(0,4).join(", ")+(lis.length>4?"…":""));
      tx.textContent="Deshacer ortografía";clearTimeout(ortoT);ortoT=setTimeout(()=>{ortoPrevio=null;tx.textContent="Ortografía (inglés)"},12000)}
  }catch(e){
    tx.textContent="Ortografía (inglés)";
    if(e&&e.code==="rate_limited")T.toast&&T.toast("Muchas solicitudes seguidas. Espera un momento.");
    else if(e&&(e.code==="not_granted"||e.code==="unavailable"))T.toast&&T.toast("La corrección de ortografía no está disponible aquí.");
    else T.toast&&T.toast("No se pudo revisar la ortografía. Inténtalo otra vez.");
  }
  bt.disabled=false;
};
/* ---------- abrir y cerrar ---------- */
async function abrir(){
  const s=T.sesion&&T.sesion(),e=T.est&&T.est();clave=s?s.id:"libre";
  $("pzQuien").textContent=s?((e?e.nombre+" · ":"")+(s.unidad?"Unidad "+s.unidad:"Clase de hoy")):"Pizarra libre";
  $("piz").hidden=false;document.body.style.overflow="hidden";ajustar();await cargar();ajustar();
  try{document.fonts&&document.fonts.load(fuente(40)).then(()=>{rehacerCache();pintar()})}catch(e){}
}
function cerrar(){cerrarTexto(true);cerrarMenu();if(sucio.size){clearTimeout(tGuardar);guardar()}$("piz").hidden=true;document.body.style.overflow=""}
$("btnPiz").onclick=abrir;$("pzSalir").onclick=cerrar;
window.addEventListener("resize",()=>{if(!$("piz").hidden)ajustar()});
document.addEventListener("keydown",e=>{
  if($("piz").hidden||e.target===ta||e.target.tagName==="SELECT")return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?$("pzReh").click():$("pzDes").click();return}
  if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();$("pzReh").click();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const mk=document.querySelectorAll("#pzBandeja .mk");
  if(/^[1-4]$/.test(k))mk[+k-1].click();else if(k==="h")mk[4].click();else if(k==="e")document.querySelector("#pzBandeja .borrador").click();else if(k==="t")$("pzTexto").click();
  else if(k==="escape"){if(!menu.hidden)cerrarMenu();else cerrar()}
  else if(k==="["){grosor=Math.max(0,grosor-1);interfaz()}else if(k==="]"){grosor=Math.min(2,grosor+1);interfaz()}
});
})();
</script>
